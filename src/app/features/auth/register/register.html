<div class="login-wrapper">

  <div class="login-card">

    <h2>Employee Management</h2>

    <p class="subtitle">Create your account</p>


    <form #registerForm="ngForm" (ngSubmit)="register(registerForm)">


      <!-- NAME -->
      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          name="name"
          [(ngModel)]="user.name"
          required
          #name="ngModel"
          [class.invalid]="name.invalid && name.touched">


        <div class="error" *ngIf="name.invalid && name.touched">

          <span *ngIf="name.errors?.['required']">
            Name is required
          </span>

        </div>

      </div>



      <!-- EMAIL -->
      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="user.email"
          required
          email
          #email="ngModel"
          [class.invalid]="email.invalid && email.touched">


        <div class="error" *ngIf="email.invalid && email.touched">

          <span *ngIf="email.errors?.['required']">
            Email is required
          </span>

          <span *ngIf="email.errors?.['email']">
            Enter a valid email
          </span>

        </div>

      </div>



      <!-- PASSWORD -->
      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="user.password"
          required
          minlength="6"
          #password="ngModel"
          [class.invalid]="password.invalid && password.touched">


        <div class="error" *ngIf="password.invalid && password.touched">

          <span *ngIf="password.errors?.['required']">
            Password is required
          </span>

          <span *ngIf="password.errors?.['minlength']">
            Password must be at least 6 characters
          </span>

        </div>

      </div>



      <!-- DEPARTMENT -->
      <div class="form-group">

        <label>Department</label>

        <input
          type="text"
          name="department"
          [(ngModel)]="user.department"
          required
          #department="ngModel"
          [class.invalid]="department.invalid && department.touched">


        <div class="error" *ngIf="department.invalid && department.touched">

          <span *ngIf="department.errors?.['required']">
            Department is required
          </span>

        </div>

      </div>



      <!-- REGISTER BUTTON -->
      <button
        type="submit"
        class="btn-submit"
        [disabled]="registerForm.invalid || loading">


        <span *ngIf="!loading">
          Create Account
        </span>


        <span *ngIf="loading">
          Creating Account...
        </span>


      </button>



    </form>


    <div class="login-links">

      <a (click)="backToLogin()">
        Back to Login
      </a>

    </div>


  </div>

</div>
